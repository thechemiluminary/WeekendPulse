name: WeekendPulse Deploy

on:
  schedule:
    # HOURLY daytime check-ins, UK 08:00-23:00 (BST, UTC+1).
    # Bot posts ONLY when a genuinely new story appears; otherwise no_content.
    # NOTE: cron runs in UTC. Hour 7-22 UTC = 08:00-23:00 UK while UK is in BST.
    # When UK clocks go back to GMT (UTC+0) in late Oct, shift to "0 8-23 * * *".
    - cron: "0 7-22 * * *"
  workflow_dispatch:        # allow manual trigger for testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (so posts_log.csv can be committed)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser Pillow google-genai

      - name: Run the bot (scrape -> AI -> post -> log)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRY_RUN: "0"
        run: python main.py

      - name: Commit and push posts_log.csv if changed
        run: |
          git config user.name "WeekendPulse Bot"
          git config user.email "bot@weekendpulse.local"
          git add posts_log.csv
          git commit -m "chore: update post log [skip ci]" || echo "No changes to log"
          git push origin HEAD:main || echo "Nothing to push / push failed"