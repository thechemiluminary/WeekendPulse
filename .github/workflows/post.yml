name: WeekendPulse Deploy

on:
  workflow_dispatch:        # triggered by cron-job.org + manual testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (so posts_log.csv can be committed)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser Pillow google-genai psd-tools[composite]

      - name: Run the bot (scrape -> AI -> post -> log)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
          DRY_RUN: "0"
        run: python -u main.py

      - name: Commit and push manifest.json if changed
        run: |
          git config user.name "WeekendPulse Bot"
          git config user.email "bot@weekendpulse.local"
          git add manifest.json
          git commit -m "chore: update manifest [skip ci]" || echo "No changes to manifest"
          git push origin HEAD:main || echo "Nothing to push / push failed"