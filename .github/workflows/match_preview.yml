name: WeekendPulse Match Preview

on:
  schedule:
    # Daily at 00:00 UTC (01:00 UK during BST). Fetches today's PL fixtures and
    # schedules a comment-bait post 5h before each kickoff via the Graph API
    # (published=false + scheduled_publish_time). Each fixture posts once.
    - cron: "0 0 * * *"
  workflow_dispatch:        # allow manual trigger for testing

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (so manifest.json can be committed)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser Pillow google-genai "psd-tools[composite]"

      - name: Run match-preview scheduler (fetch fixtures -> schedule posts)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
          DRY_RUN: "0"
        run: python main.py --match-preview

      - name: Commit and push manifest.json if changed
        run: |
          git config user.name "WeekendPulse Bot"
          git config user.email "bot@weekendpulse.local"
          git add manifest.json
          git commit -m "chore: update manifest (match previews) [skip ci]" || echo "No changes to manifest"
          git push origin HEAD:main || echo "Nothing to push / push failed"
